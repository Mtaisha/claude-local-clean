name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lint tool
        run: python -m pip install ruff
      - name: Compile
        run: python -m py_compile server.py claude_account_cleanup.py clean_claude_tracking.py local_desktop_privacy.py
      - name: Test
        run: python -m unittest -v
      - name: Lint
        run: ruff check .
